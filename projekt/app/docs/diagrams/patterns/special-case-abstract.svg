@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Client
class Base {
  +isValid() : boolean
  +exists() : boolean
}
class Normal
class "Special Case" as SC {
  +isValid() : false
  +exists() : false
}
Client - -> Base
Normal - -|> Base
SC - -|> Base
@enduml

