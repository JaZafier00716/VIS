@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Presentation
class "Service Layer" as SL {
  +useCaseOperation()
}
class DomainObject
class Mapper
Presentation - -> SL
SL - -> DomainObject
SL - -> Mapper
@enduml

