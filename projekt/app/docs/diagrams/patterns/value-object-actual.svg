@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Money <<Value Object>> {
  -amount : BigDecimal
  {static} +ZERO : Money
  {static} +of(BigDecimal) : Money
  {static} +of(String) : Money
  +plus(Money) : Money
  +minus(Money) : Money
  +times(BigDecimal) : Money
  +equals(Object) : boolean
  +hashCode() : int
}
class MenuItem {
  +price(PriceStrategy) : Money
}
class Product
MenuItem - -> Money
Product - -> Money
@enduml

