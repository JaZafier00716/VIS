link OracleProjectMapper to Project--><path d="M147,83.65 C147,109.07 147,143.53 147,168.33 " fill="none" id="OracleProjectMapper-&gt;Project" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="147,173.48,151,164.48,147,168.48,143,164.48,147,173.48" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="127" x="148" y="133.897">builds with Customer</text><!--MD5=[d2610f390d2196d740c95788e7def282]
@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Project {
  -customer : Customer
}
class Customer
class projects <<table>> {
  PK project_id
  FK customer_id
}
class customers <<table>> {
  PK customer_id
}
class OracleProjectMapper {
  SELECT ... FROM projects p\nJOIN customers c ON c.customer_id = p.customer_id
}
Project - -> Customer
projects - -> customers : customer_id
OracleProjectMapper ..> Project : builds with Customer
@enduml

