@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Service
interface Gateway
class RealGateway
class ServiceStub <<test>>
Service - -> Gateway
RealGateway ..|> Gateway
ServiceStub ..|> Gateway
@enduml

