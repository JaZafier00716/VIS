link Jdbc to Database--><path d="M289.5,233.68 C289.5,254.82 289.5,278.93 289.5,296.69 " fill="none" id="Jdbc-&gt;Database" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="289.5,301.98,293.5,292.98,289.5,296.98,285.5,292.98,289.5,301.98" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[6aaf03c09c9514c7809df519c72e6758]
@startuml
skinparam backgroundColor white
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #444444
}
skinparam note {
  BackgroundColor #FFFFE0
  BorderColor #999999
}
hide empty members

class Project <<Domain object>>
interface ProjectMapper <<mapper interface (port)>> {
  +findAll() : List<Project>
  +findById(long) : Optional<Project>
  +insert(Project)
  +update(Project)
}
class OracleProjectMapper <<Data Mapper>>
class Jdbc <<JDBC helper>> {
  {static} query(...)
  {static} update(...)
  {static} insert(...)
}
class Database <<connection>>
class ProjectService
ProjectService - -> ProjectMapper
OracleProjectMapper ..|> ProjectMapper
OracleProjectMapper ..> Project : rows <-> objects
OracleProjectMapper - -> Jdbc
Jdbc - -> Database
@enduml

